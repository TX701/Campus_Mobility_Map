name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy Website to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install

      - name: Inject API_KEY into .env file
        run: echo "VITE_API_KEY=${{ secrets.MAPBOX_TOKEN }}" >> .env

      - name: Build Website
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync ./dist/ s3://mobility-map-website/ --delete
          aws s3 sync ./dist/ s3://mobility-map-website/ --delete --acl public-read
          aws s3 cp script.js s3://mobility-map-website/assets/script.js --content-type "application/javascript"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-2"
