name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build and Deploy Website to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install

      - name: Inject secret variables into .env file
        run: |
          echo "VITE_API_KEY=${{ secrets.MAPBOX_TOKEN }}" >> .env
          echo "VITE_WEBHOOK_GET=${{ secrets.WEBHOOK_GET }}" >> .env
          echo "VITE_WEBHOOK_PUT=${{ secrets.WEBHOOK_PUT }}" >> .env

      - name: Build Website
        run: npm run build

      - name: Deploy to S3
        run: |
          run: |
          aws s3 sync ./dist/ s3://mobility-map-website/ --delete --acl public-read \
            --exclude "*.html" "*.css" --include "*.js" --content-type "application/javascript"
          aws s3 sync ./dist/ s3://mobility-map-website/ --delete --acl public-read --exclude "*.js" --content-type "text/html"
          # aws s3 sync ./dist/ s3://mobility-map-website/ --delete --acl public-read --exclude "*.js" "*.html" --content-type "text/css"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-2"