<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <p>Click the button below to view the API key:</p>
    <button onclick="showApiKey()">Show API Key</button>
    <p id="api-response"></p>

    <script>
        function showApiKey() {
            const apiKey = process.env.API_KEY;
            document.getElementById("api-response").innerText = apiKey ? `API Key: ${apiKey}` : 'API Key not available';
        }
    </script>
</body>
</html>
